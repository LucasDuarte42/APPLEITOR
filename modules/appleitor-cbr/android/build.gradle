plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.appleitorcbr'
version = '0.1.0'

dependencies {
  implementation 'com.github.junrar:junrar:7.5.8'
}

android {
  namespace "expo.modules.appleitorcbr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
